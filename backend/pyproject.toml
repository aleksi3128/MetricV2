[project]
name = "metric-backend"
version = "0.13.0"
description = "Metric — API de suivi sportif personnel, stockage CSV sur Nextcloud"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  # httpx2 et non httpx : starlette 1.x déprécie httpx pour son TestClient, et le
  # client WebDAV (`L01-01`) doit parler la même bibliothèque que les tests.
  "httpx2>=2.9",
  "python-dateutil>=2.9",
  # Téléversement de photos de repas (`NUT-01`) : FastAPI en dépend pour le multipart.
  "python-multipart>=0.0.20",
  # Préparation des images avant envoi à un modèle vision (`IA-06`) : redimensionnement
  # et conversion JPEG. Côté serveur et non côté navigateur, parce qu'une photo **déjà
  # rangée** sur Nextcloud doit pouvoir être analysée elle aussi — un canvas ne la voit
  # jamais.
  "pillow>=11.0",
  # Chiffrement Web Push (`NOT-01`) : `aes128gcm` et l'échange ECDH de la RFC 8291. Le
  # projet évite les dépendances — CDP piloté sans Playwright, client WebDAV maison — et
  # cette économie ne s'applique pas ici : une erreur d'implémentation cryptographique ne
  # produit pas un bogue visible mais un chiffrement plus faible qu'annoncé.
  # Seul `WebPusher.encode` est appelé, qui ne fait aucune I/O ; l'envoi passe par httpx2
  # comme tout le reste, pour ne pas bloquer la boucle d'événements sur `requests`.
  "pywebpush>=2.0",
  # Décodage des fichiers `.fit` d'une sortie course (`docs/import-fit.md`, **F4**). Le
  # dépôt évite les dépendances, et l'exception se justifie autrement que pour
  # `pywebpush` : le format n'est pas dangereux à mal lire, il est **vaste** — un profil
  # de plusieurs centaines de messages, un fabricant qui écrit deux flux de `record`
  # entrelacés là où un autre en écrit un. Un décodeur maison lirait Strava et pas
  # Garmin, et on ne le saurait qu'au premier fichier qui ne s'ouvre pas.
  "fitdecode>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ── Ruff ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff
  "ASYNC",    # pièges async
  "DTZ",      # datetime sans fuseau — critique pour HEAT-32
]
ignore = [
  "E501",  # longueur gérée par le formateur
]
# Le signe multiplié est la notation du backlog (« charge × séries × réps ») et le tiret
# demi-cadratin ponctue les commentaires français. Ce ne sont pas des coquilles.
# L'espace fine insécable (U+202F) est ce que produit le formatage français des
# nombres : on la retire des saisies à dessein, ce n'est pas une coquille.
allowed-confusables = ["×", "–", "’", "\u202f"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ── Mypy ────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# `pywebpush` et `py_vapid` ne publient pas de `py.typed`. Les deux ne sont appelés que
# depuis `domains/notifications/push.py`, qui enveloppe leurs trois usages derrière une
# interface typée — la surface non vérifiée tient en trois lignes.
[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

# `fitdecode` ne publie pas de `py.typed` non plus. Même parade : il n'est appelé que
# depuis `domains/activity/fit.py`, dont `_values` ramène tout de suite chaque message à un
# `dict[str, object]` — la surface non vérifiée s'arrête à la boucle de lecture, et les
# lectures défensives du bas du module sont ce qui la referme.
[[tool.mypy.overrides]]
module = ["fitdecode.*"]
ignore_missing_imports = true

# ── Pytest ──────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error",
  # **Une seule exception, et elle n'est pas la nôtre.** `starlette.testclient` lit
  # `anyio.abc.BlockingPortal` au moment de l'import ; `anyio` 4.15 a transformé cet alias
  # en shim qui avertit. La batterie tombe donc à la **collecte**, avant tout test, sur une
  # dépréciation qu'aucune ligne du projet ne provoque et qu'aucune ne peut corriger.
  #
  # Écarté : figer `anyio < 4.15`. Ce serait retenir une bibliothèque du cœur asynchrone
  # de l'application — celle qui porte le stockage et l'API — pour un avertissement qui
  # n'existe qu'au banc d'essai. Le prix serait payé en production pour un défaut de test.
  #
  # Le filtre vise le message exact : il ne masque rien d'autre, et il ne masquera pas la
  # rupture qui vient. Le jour où `anyio` **retire** l'alias, `starlette` lèvera une
  # `ImportError` que ceci n'attrape pas. Cette ligne disparaît dès que starlette lit
  # `anyio.from_thread.BlockingPortal` — vérifié à chaque montée de version.
  #
  # Trouvé en production, pas ici : l'installation du serveur est neuve à chaque release
  # et résout les versions les plus récentes, là où le venv local vieillit. C'est pour
  # cette raison que les versions locales ont été montées avec ce correctif.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
# La couche stockage est asynchrone de bout en bout : `async def test_…` sans décorateur.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
