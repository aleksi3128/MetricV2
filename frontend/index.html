<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` : sans lui, `env(safe-area-inset-*)` rend 0 et l'îlot
         dynamique comme l'indicateur d'accueil rognent l'interface.
         Ni `maximum-scale` ni `user-scalable=no` : le zoom reste possible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Valeurs de départ : le sombre est le thème de la charte. Le script ci-dessous les
         corrige avant la première peinture si le thème résolu est le clair. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0D0B0C" />
    <!--
      Le thème, posé avant que quoi que ce soit ne s'affiche.

      Il doit tourner ici, en ligne et synchrone : monté dans React, il s'exécuterait
      après la première peinture et chaque chargement commencerait par un éclair sombre
      sur un thème clair. C'est la seule logique d'application qui vit dans ce fichier,
      et elle est volontairement réduite à trois lignes — la suite est dans
      `lib/theme.ts`, qui reprend cet état et le tient.

      Les deux couleurs répètent `--bg` des deux thèmes de `tokens.css`, parce qu'aucune
      feuille de style n'est encore chargée à cet instant. `tokens.test.ts` vérifie
      qu'elles ne dérivent pas, et `applyTheme` les relit sur le token dès que possible.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('metric.theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var theme =
            mode === 'system'
              ? matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode;

          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="color-scheme"]').content = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'light' ? '#F7F4F4' : '#0D0B0C';
        } catch (error) {
          // Stockage refusé ou `matchMedia` absent : le sombre des balises ci-dessus
          // reste en place, et l'application s'affiche.
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <!-- Ajoutée à l'écran d'accueil, l'application s'ouvre sans la barre d'adresse
         de Safari : 745 px utiles deviennent 874 sur un iPhone 16 Pro. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Metric" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Le manifeste (`L15-01`). Il ne porte qu'un `theme_color` là où l'application en a
      deux : c'est celui du thème sombre, celui de `:root` dans `tokens.css`. La balise
      `theme-color` ci-dessus en porte un par thème et **gagne** à l'exécution — le
      manifeste ne décide donc que de l'écran de démarrage à l'installation.
      `tokens.test.ts` vérifie que les deux ne dérivent pas des tokens.

      iOS ignore le manifeste pour l'icône : il lui faut `apple-touch-icon`, en PNG, sans
      transparence. Les quatre fichiers sont dessinés par `scripts/make-icons.py` depuis
      la règle graduée, le motif signature de `GuidelinesUI.html`.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="Metric — le journal instrumenté d'une vie. Suivi sportif personnel."
    />
    <title>Metric</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
